<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .headset-outline {
      fill: none;
      stroke: currentColor;
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .headset-cable {
      fill: none;
      stroke: #2FD98A;
      stroke-width: 20;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .headset-jack {
      fill: #2FD98A;
      transform-origin: 235px 452px;
      animation: jack-pulse 1.6s ease-in-out infinite;
    }
    .headset-ring {
      fill: none;
      stroke: #2FD98A;
      stroke-width: 10;
      transform-origin: 235px 452px;
      opacity: 0;
      animation: ring-pulse 1.6s ease-out infinite;
    }
    @keyframes jack-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22); }
    }
    @keyframes ring-pulse {
      0% { transform: scale(0.6); opacity: 0.55; }
      70% { transform: scale(1.9); opacity: 0; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .headset-jack, .headset-ring { animation: none; }
    }
  </style>

  <!-- дуга оголовья -->
  <path class="headset-outline" d="M 96 256 A 160 160 0 0 1 416 256" />

  <!-- левый наушник -->
  <rect class="headset-outline" x="56" y="236" width="70" height="150" rx="35" />
  <!-- правый наушник -->
  <rect class="headset-outline" x="386" y="236" width="70" height="150" rx="35" />

  <!-- провод от правого наушника к разъёму -->
  <path class="headset-cable" d="M 421 386 L 421 420 A 30 30 0 0 1 391 450 L 260 452" />

  <!-- разъём/индикатор поддержки — пульсирует -->
  <circle class="headset-ring" cx="235" cy="452" r="14" />
  <circle class="headset-jack" cx="235" cy="452" r="14" />
</svg>
