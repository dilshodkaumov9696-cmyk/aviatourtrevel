[project]
name = "aviator-web-backend"
version = "0.1.0"
description = "Aviator Web - сайт продажи авиабилетов (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",  # нужен pydantic.EmailStr в подписках на цену
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",  # обязателен для async-режима SQLAlchemy
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один event loop на всю сессию: движок SQLAlchemy и клиент Redis — модульные
# синглтоны, созданные один раз при импорте. С loop-om per-test они бы
# пытались писать в уже закрытый loop предыдущего теста.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
