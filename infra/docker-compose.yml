services:
  postgres:
    image: postgres:17-alpine
    container_name: aviator_postgres
    environment:
      POSTGRES_USER: aviator
      POSTGRES_PASSWORD: aviator
      POSTGRES_DB: aviator_web
    ports:
      # 5432 на хосте занят нативным Postgres (там база другого проекта),
      # и он перехватывает localhost. Разводим порты, чтобы не трогать чужое.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviator -d aviator_web"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aviator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: aviator_nginx
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
